<script>
// ─── HELPERS ─────────────────────────────────────────────────────────────────
function addXP(amount, label) {
  state.xp += amount;
  const t = document.getElementById('xp-toast');
  t.textContent = `+${amount} XP — ${label}`;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
  updateXPBar();
}

function updateXPBar() {
  const lvl = Math.floor(state.xp / XP_PER_LEVEL) + 1;
  state.level = lvl;
  const pct = ((state.xp % XP_PER_LEVEL) / XP_PER_LEVEL) * 100;
  document.getElementById('xp-val').textContent = state.xp;
  document.getElementById('lvl-val').textContent = lvl;
  document.getElementById('xp-fill').style.width = pct + '%';
}

function getModule(moduleId) {
  for (const phase of COURSE) {
    for (const mod of phase.modules) {
      if (mod.id === moduleId) return { phase, mod };
    }
  }
  return null;
}

function stars(n, max = 4) {
  return '★'.repeat(n) + '☆'.repeat(max - n);
}

function phaseProgress(phase) {
  const total = phase.modules.length;
  const done = phase.modules.filter(m => state.completedModules.has(m.id)).length;
  return { done, total, pct: total ? Math.round((done / total) * 100) : 0 };
}

function checkPhaseComplete(phaseId) {
  const phase = COURSE.find(p => p.id === phaseId);
  if (!phase) return;
  const allDone = phase.modules.every(m => state.completedModules.has(m.id));
  if (allDone) {
    const el = document.getElementById(phase.badgeId);
    if (el && !el.classList.contains('earned')) {
      el.classList.add('earned');
      addXP(100, `Phase Complete! ${phase.icon}`);
    }
  }
}

// ─── SIDEBAR ─────────────────────────────────────────────────────────────────
function buildNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  COURSE.forEach(phase => {
    const grp = document.createElement('div');
    grp.className = 'phase-group';
    const lbl = document.createElement('div');
    lbl.className = 'phase-label';
    lbl.style.color = phase.color;
    lbl.innerHTML = `<span class="phase-icon">${phase.icon}</span>${phase.title}<span class="chevron">▶</span>`;
    lbl.onclick = () => {
      lbl.classList.toggle('open');
    };
    const list = document.createElement('div');
    list.className = 'module-list';
    phase.modules.forEach(mod => {
      const item = document.createElement('div');
      item.className = 'mod-item' + (state.completedModules.has(mod.id) ? ' done' : '');
      item.id = 'nav-' + mod.id;
      item.innerHTML = `${mod.title}<span class="check"></span>`;
      item.onclick = () => openModule(mod.id);
      list.appendChild(item);
    });
    grp.appendChild(lbl);
    grp.appendChild(list);
    nav.appendChild(grp);
  });
}

function setActiveNav(moduleId) {
  document.querySelectorAll('.mod-item').forEach(el => el.classList.remove('active'));
  const el = document.getElementById('nav-' + moduleId);
  if (el) {
    el.classList.add('active');
    // auto-open phase
    const parent = el.closest('.phase-group');
    if (parent) {
      const lbl = parent.querySelector('.phase-label');
      if (lbl && !lbl.classList.contains('open')) lbl.classList.add('open');
    }
  }
}

// ─── DASHBOARD ───────────────────────────────────────────────────────────────
function showDashboard() {
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('module-view').style.display = 'none';
  document.getElementById('topbar-title').textContent = 'Dashboard';
  document.querySelectorAll('.mod-item').forEach(el => el.classList.remove('active'));
  renderDashboard();
}

function renderDashboard() {
  const totalMods = COURSE.reduce((s, p) => s + p.modules.length, 0);
  const doneMods = state.completedModules.size;
  const totalQ = COURSE.reduce((s, p) => p.modules.reduce((s2, m) => s2 + (m.quiz ? m.quiz.length : 0), s), 0);
  const correctQ = Object.values(state.quizScores).reduce((s, v) => s + v, 0);

  document.getElementById('dashboard').innerHTML = `
    <div class="dash-greeting">Welcome back, Panduranga 👋</div>
    <div class="dash-sub">Your 12-Week Data Engineering Mastery Path — March 2026</div>
    <div class="dash-grid">
      <div class="stat-card"><div class="val">${state.xp}</div><div class="lbl">Total XP Earned</div></div>
      <div class="stat-card"><div class="val">${state.level}</div><div class="lbl">Current Level</div></div>
      <div class="stat-card"><div class="val">${doneMods}/${totalMods}</div><div class="lbl">Modules Completed</div></div>
      <div class="stat-card"><div class="val">${correctQ}/${totalQ}</div><div class="lbl">Quiz Answers Correct</div></div>
    </div>
    <h3 style="font-size:14px;margin-bottom:14px;color:var(--muted)">PHASES</h3>
    <div class="phase-cards">
      ${COURSE.map(phase => {
        const {done, total, pct} = phaseProgress(phase);
        return `<div class="phase-card" onclick="openFirstModule('${phase.id}')">
          <div class="pc-head">
            <span class="pc-icon">${phase.icon}</span>
            <div><div class="pc-title">${phase.title}</div><div class="pc-weeks">${phase.weeks}</div></div>
          </div>
          <div style="font-size:12px;color:var(--muted)">${done}/${total} modules · ${pct}% complete</div>
          <div class="pc-bar"><div class="pc-fill" style="width:${pct}%;background:${phase.color}"></div></div>
        </div>`;
      }).join('')}
    </div>
    <div style="margin-top:28px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px">
      <h3 style="font-size:14px;margin-bottom:14px;color:var(--accent)">📊 Your Market Position (from your guide)</h3>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px">
        ${[
          {role:'Analytics Engineer', fit:'⭐⭐⭐⭐⭐', sal:'₹10–25 LPA', note:'Best fit — target first'},
          {role:'AWS Data Engineer', fit:'⭐⭐⭐⭐', sal:'₹10–22 LPA', note:'Strong fit — target second'},
          {role:'Core Data Engineer', fit:'⭐⭐⭐⭐', sal:'₹8–22 LPA', note:'Apply immediately'},
          {role:'Databricks DE', fit:'⭐⭐⭐', sal:'₹12–28 LPA', note:'After Phase 4'},
        ].map(r => `<div style="background:#21262d;border-radius:8px;padding:12px">
          <div style="font-size:13px;font-weight:600">${r.role}</div>
          <div style="font-size:12px;color:var(--yellow);margin:3px 0">${r.fit}</div>
          <div style="font-size:12px;color:var(--green)">${r.sal}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:3px">${r.note}</div>
        </div>`).join('')}
      </div>
    </div>`;
}

function openFirstModule(phaseId) {
  const phase = COURSE.find(p => p.id === phaseId);
  if (phase && phase.modules.length) openModule(phase.modules[0].id);
}

// ─── MODULE VIEW ─────────────────────────────────────────────────────────────
function openModule(moduleId) {
  const found = getModule(moduleId);
  if (!found) return;
  const { phase, mod } = found;
  state.currentModule = moduleId;

  document.getElementById('dashboard').style.display = 'none';
  const mv = document.getElementById('module-view');
  mv.style.display = 'block';
  document.getElementById('topbar-title').textContent = mod.title;
  setActiveNav(moduleId);

  mv.innerHTML = `
    <div class="mv-header">
      <div class="mv-breadcrumb">${phase.icon} ${phase.title} › ${mod.title}</div>
      <div class="mv-title">${mod.title}</div>
      <div class="mv-meta">
        <span class="diff-stars">${stars(mod.difficulty)}</span>
        <span>Difficulty ${mod.difficulty}/4</span>
        ${state.completedModules.has(mod.id) ? '<span style="color:var(--green)">✓ Completed</span>' : ''}
      </div>
    </div>
    <div class="tabs">
      <div class="tab active" onclick="switchTab(this,'learn')">📖 Learn</div>
      <div class="tab" onclick="switchTab(this,'flashcards')">🃏 Flashcards (${(mod.flashcards||[]).length})</div>
      <div class="tab" onclick="switchTab(this,'quiz')">🧠 Quiz (${(mod.quiz||[]).length} Q)</div>
      <div class="tab" onclick="switchTab(this,'challenge')">💻 Code Challenge</div>
    </div>
    <div class="tab-panel active" id="tp-learn">${buildLearn(mod)}</div>
    <div class="tab-panel" id="tp-flashcards">${buildFlashcards(mod)}</div>
    <div class="tab-panel" id="tp-quiz">${buildQuiz(mod)}</div>
    <div class="tab-panel" id="tp-challenge">${buildChallenge(mod)}</div>`;

  // init flashcard index
  state._fcIdx = state._fcIdx || {};
  state._fcIdx[moduleId] = state._fcIdx[moduleId] || 0;
  state._fcSeen = state._fcSeen || {};
  state._fcSeen[moduleId] = state._fcSeen[moduleId] || new Set();
  renderFlashcard(mod);
}

function switchTab(el, name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tp-' + name).classList.add('active');
}

// ─── LEARN TAB ───────────────────────────────────────────────────────────────
function buildLearn(mod) {
  if (!mod.learn) return '<p>No content</p>';
  return mod.learn.map(sec => {
    let html = `<div class="learn-section"><h3>${sec.h}</h3>`;
    if (sec.p) html += `<p>${sec.p}</p>`;
    if (sec.code) html += `<div class="code-block"><pre>${escHtml(sec.code)}</pre></div>`;
    if (sec.refs) {
      html += '<ul>' + sec.refs.map(r => {
        const parts = r.split(' — ');
        return `<li><a class="ref-link" href="https://${parts[0].replace('https://','')}" target="_blank">🔗 ${parts[0]}</a>${parts[1] ? ' — ' + parts[1] : ''}</li>`;
      }).join('') + '</ul>';
    }
    if (sec.tip) html += `<div class="tip-box">${sec.tip}</div>`;
    html += '</div>';
    return html;
  }).join('');
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─── FLASHCARDS ──────────────────────────────────────────────────────────────
function buildFlashcards(mod) {
  if (!mod.flashcards || !mod.flashcards.length) return '<p style="color:var(--muted)">No flashcards for this module.</p>';
  return `<div class="fc-container">
    <div class="fc-progress" id="fc-prog-${mod.id}">Card 1 of ${mod.flashcards.length}</div>
    <div class="fc-card" id="fc-card-${mod.id}" onclick="flipCard('${mod.id}')">
      <div class="fc-inner">
        <div class="fc-front"><div class="q" id="fc-q-${mod.id}"></div><div class="hint">Click to reveal answer</div></div>
        <div class="fc-back"><div class="a" id="fc-a-${mod.id}"></div></div>
      </div>
    </div>
    <div class="fc-btns">
      <button class="fc-btn" onclick="prevCard('${mod.id}')">← Prev</button>
      <button class="fc-btn primary" onclick="nextCard('${mod.id}')">Next →</button>
    </div>
    <div class="fc-dots" id="fc-dots-${mod.id}">
      ${mod.flashcards.map((_,i) => `<div class="fc-dot" id="fc-dot-${mod.id}-${i}"></div>`).join('')}
    </div>
  </div>`;
}

function renderFlashcard(mod) {
  if (!mod.flashcards || !mod.flashcards.length) return;
  const idx = (state._fcIdx[mod.id] || 0);
  const card = mod.flashcards[idx];
  const qEl = document.getElementById('fc-q-' + mod.id);
  const aEl = document.getElementById('fc-a-' + mod.id);
  const progEl = document.getElementById('fc-prog-' + mod.id);
  const cardEl = document.getElementById('fc-card-' + mod.id);
  if (!qEl || !aEl) return;
  qEl.textContent = card.q;
  aEl.innerHTML = card.a;
  progEl.textContent = `Card ${idx + 1} of ${mod.flashcards.length}`;
  if (cardEl) cardEl.classList.remove('flipped');
  // dots
  mod.flashcards.forEach((_, i) => {
    const dot = document.getElementById(`fc-dot-${mod.id}-${i}`);
    if (dot) dot.className = 'fc-dot' + ((state._fcSeen[mod.id] || new Set()).has(i) ? ' seen' : '');
  });
}

function flipCard(modId) {
  const el = document.getElementById('fc-card-' + modId);
  if (!el) return;
  el.classList.toggle('flipped');
  const found = getModule(modId);
  if (!found) return;
  const idx = state._fcIdx[modId] || 0;
  if (!state._fcSeen[modId]) state._fcSeen[modId] = new Set();
  if (!state._fcSeen[modId].has(idx)) {
    state._fcSeen[modId].add(idx);
    addXP(XP_FLASHCARD, 'Flashcard viewed');
    // mark dot
    const dot = document.getElementById(`fc-dot-${modId}-${idx}`);
    if (dot) dot.className = 'fc-dot seen';
    // check if all seen → module complete
    if (state._fcSeen[modId].size === found.mod.flashcards.length) {
      checkModuleComplete(modId);
    }
  }
}

function nextCard(modId) {
  const found = getModule(modId);
  if (!found) return;
  const len = found.mod.flashcards.length;
  state._fcIdx[modId] = ((state._fcIdx[modId] || 0) + 1) % len;
  renderFlashcard(found.mod);
}

function prevCard(modId) {
  const found = getModule(modId);
  if (!found) return;
  const len = found.mod.flashcards.length;
  state._fcIdx[modId] = ((state._fcIdx[modId] || 0) - 1 + len) % len;
  renderFlashcard(found.mod);
}

// ─── QUIZ ─────────────────────────────────────────────────────────────────────
function buildQuiz(mod) {
  if (!mod.quiz || !mod.quiz.length) return '<p style="color:var(--muted)">No quiz for this module.</p>';
  const letters = ['A','B','C','D'];
  let html = `<div class="quiz-wrap" id="quiz-wrap-${mod.id}">`;
  mod.quiz.forEach((q, qi) => {
    html += `<div class="quiz-question" id="qq-${mod.id}-${qi}">
      <div class="quiz-q-num">Question ${qi+1} of ${mod.quiz.length}</div>
      <div class="quiz-q-text">${q.q}</div>
      <div class="quiz-opts">`;
    q.opts.forEach((opt, oi) => {
      html += `<div class="quiz-opt" id="qo-${mod.id}-${qi}-${oi}" onclick="selectOpt('${mod.id}',${qi},${oi})">
        <span class="opt-letter">${letters[oi]}</span>${opt}
      </div>`;
    });
    html += `</div>
      <div class="quiz-explanation" id="qe-${mod.id}-${qi}">💡 ${q.exp}</div>
    </div>`;
  });
  html += `<button class="quiz-submit" id="quiz-submit-${mod.id}" onclick="submitQuiz('${mod.id}')" disabled>Submit Answers</button>`;
  html += `<div id="quiz-result-${mod.id}" style="margin-top:20px"></div>`;
  html += '</div>';
  return html;
}

const quizSelections = {};

function selectOpt(modId, qi, oi) {
  const found = getModule(modId);
  if (!found || !found.mod.quiz) return;
  // If quiz already submitted, ignore
  if (document.getElementById(`quiz-submit-${modId}`) &&
      document.getElementById(`quiz-submit-${modId}`).disabled &&
      document.getElementById(`quiz-result-${modId}`).innerHTML) return;

  if (!quizSelections[modId]) quizSelections[modId] = {};
  quizSelections[modId][qi] = oi;

  // Update UI for this question
  found.mod.quiz[qi].opts.forEach((_, i) => {
    const el = document.getElementById(`qo-${modId}-${qi}-${i}`);
    if (el) el.className = 'quiz-opt' + (i === oi ? ' selected' : '');
  });

  // Enable submit if all answered
  const total = found.mod.quiz.length;
  const answered = Object.keys(quizSelections[modId] || {}).length;
  const btn = document.getElementById(`quiz-submit-${modId}`);
  if (btn && answered >= total) btn.disabled = false;
}

function submitQuiz(modId) {
  const found = getModule(modId);
  if (!found) return;
  const quiz = found.mod.quiz;
  const sels = quizSelections[modId] || {};
  let correct = 0;

  quiz.forEach((q, qi) => {
    const selected = sels[qi];
    const isCorrect = selected === q.ans;
    if (isCorrect) correct++;

    // Show correct/wrong on opts
    q.opts.forEach((_, oi) => {
      const el = document.getElementById(`qo-${modId}-${qi}-${oi}`);
      if (!el) return;
      if (oi === q.ans) el.className = 'quiz-opt correct';
      else if (oi === selected && !isCorrect) el.className = 'quiz-opt wrong';
      else el.className = 'quiz-opt';
      el.onclick = null;
    });

    // Show explanation
    const expEl = document.getElementById(`qe-${modId}-${qi}`);
    if (expEl) expEl.classList.add('show');
  });

  // Hide submit
  const btn = document.getElementById(`quiz-submit-${modId}`);
  if (btn) btn.style.display = 'none';

  // XP
  const xpEarned = correct * XP_QUIZ_CORRECT;
  if (!state.quizScores[modId]) {
    state.quizScores[modId] = correct;
    if (xpEarned > 0) addXP(xpEarned, `Quiz: ${correct}/${quiz.length} correct`);
  }

  const pct = Math.round((correct / quiz.length) * 100);
  const emoji = pct >= 80 ? '🏆' : pct >= 60 ? '👍' : '📚';
  document.getElementById(`quiz-result-${modId}`).innerHTML = `
    <div class="quiz-score-card">
      <div class="big-score">${pct}%</div>
      <div class="score-lbl">${correct} of ${quiz.length} correct ${emoji}</div>
      <div class="xp-earned">+${xpEarned} XP earned</div>
      ${pct < 80 ? '<p style="font-size:12px;color:var(--muted);margin-top:8px">Review the explanations above, then try the flashcards again.</p>' : ''}
      <button class="retry-btn" onclick="retryQuiz('${modId}')">🔄 Retry Quiz</button>
    </div>`;

  checkModuleComplete(modId);
}

function retryQuiz(modId) {
  quizSelections[modId] = {};
  delete state.quizScores[modId];
  const found = getModule(modId);
  if (found) {
    document.getElementById('tp-quiz').innerHTML = buildQuiz(found.mod);
  }
}

// ─── CODE CHALLENGE ──────────────────────────────────────────────────────────
function buildChallenge(mod) {
  if (!mod.challenges || !mod.challenges.length) return '<p style="color:var(--muted)">No code challenge for this module.</p>';
  let html = '<div class="cc-wrap">';
  mod.challenges.forEach((ch, ci) => {
    html += `<div class="cc-card" id="cc-card-${mod.id}-${ci}">
      <h4>💻 Challenge ${ci+1}: ${ch.title}</h4>
      <div class="cc-type">Select the correct code option</div>
      <div class="cc-scenario">${ch.scenario}</div>
      <div class="cc-opts" id="cc-opts-${mod.id}-${ci}">`;
    ch.opts.forEach((opt, oi) => {
      html += `<div class="cc-opt" id="cc-opt-${mod.id}-${ci}-${oi}" onclick="selectCC('${mod.id}',${ci},${oi})">
        <pre>${escHtml(opt)}</pre>
      </div>`;
    });
    html += `</div>
      <button class="cc-check-btn" id="cc-btn-${mod.id}-${ci}" onclick="checkCC('${mod.id}',${ci})" disabled>Check Answer</button>
      <div class="cc-result" id="cc-res-${mod.id}-${ci}"></div>
    </div>`;
  });
  html += '</div>';
  return html;
}

const ccSelections = {};

function selectCC(modId, ci, oi) {
  if (!ccSelections[modId]) ccSelections[modId] = {};
  ccSelections[modId][ci] = oi;
  const found = getModule(modId);
  if (!found || !found.mod.challenges) return;
  found.mod.challenges[ci].opts.forEach((_, i) => {
    const el = document.getElementById(`cc-opt-${modId}-${ci}-${i}`);
    if (el) el.className = 'cc-opt' + (i === oi ? ' selected' : '');
  });
  const btn = document.getElementById(`cc-btn-${modId}-${ci}`);
  if (btn) btn.disabled = false;
}

function checkCC(modId, ci) {
  const found = getModule(modId);
  if (!found) return;
  const ch = found.mod.challenges[ci];
  const selected = (ccSelections[modId] || {})[ci];
  if (selected === undefined) return;

  const isCorrect = selected === ch.ans;

  // Show result on opts
  ch.opts.forEach((_, oi) => {
    const el = document.getElementById(`cc-opt-${modId}-${ci}-${oi}`);
    if (!el) return;
    if (oi === ch.ans) el.className = 'cc-opt correct';
    else if (oi === selected && !isCorrect) el.className = 'cc-opt wrong';
    else el.className = 'cc-opt';
    el.onclick = null;
  });

  const resEl = document.getElementById(`cc-res-${modId}-${ci}`);
  if (isCorrect) {
    resEl.className = 'cc-result show pass';
    resEl.innerHTML = `✅ Correct! ${ch.exp}`;
    const key = `${modId}-${ci}`;
    if (!state.ccScores[key]) {
      state.ccScores[key] = true;
      addXP(XP_CC_CORRECT, 'Code Challenge solved!');
    }
  } else {
    resEl.className = 'cc-result show fail';
    resEl.innerHTML = `❌ Not quite. ${ch.exp}`;
  }

  const btn = document.getElementById(`cc-btn-${modId}-${ci}`);
  if (btn) btn.disabled = true;

  checkModuleComplete(modId);
}

// ─── COMPLETION ──────────────────────────────────────────────────────────────
function checkModuleComplete(modId) {
  if (state.completedModules.has(modId)) return;
  const found = getModule(modId);
  if (!found) return;
  const { phase, mod } = found;

  const quizDone = !mod.quiz || mod.quiz.length === 0 || state.quizScores[modId] !== undefined;
  const fcDone = !mod.flashcards || mod.flashcards.length === 0 ||
    (state._fcSeen && state._fcSeen[modId] && state._fcSeen[modId].size >= Math.ceil(mod.flashcards.length * 0.5));
  const ccDone = !mod.challenges || mod.challenges.length === 0 ||
    mod.challenges.some((_, ci) => state.ccScores[`${modId}-${ci}`]);

  if (quizDone && fcDone && ccDone) {
    state.completedModules.add(modId);
    addXP(50, `Module Complete: ${mod.title}`);
    const navEl = document.getElementById('nav-' + modId);
    if (navEl) navEl.classList.add('done');
    checkPhaseComplete(phase.id);

    // Show completion banner
    const mv = document.getElementById('module-view');
    const existing = mv.querySelector('.complete-banner');
    if (!existing) {
      const banner = document.createElement('div');
      banner.className = 'complete-banner';
      banner.style.cssText = 'background:#12261e;border:1px solid var(--green);border-radius:8px;padding:12px 16px;margin-bottom:16px;color:var(--green);font-size:13px;font-weight:600';
      banner.textContent = `✓ Module "${mod.title}" completed! +50 XP`;
      mv.insertBefore(banner, mv.firstChild);
    }
  }
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
buildNav();
showDashboard();
</script>
